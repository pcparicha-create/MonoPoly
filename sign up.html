<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAKA - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #ffe5e5;
            color: #a00000;
        }

        .message.success {
            display: block;
            background: #e5f7e8;
            color: #176b25;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <div class="logo">
        KAKA
    </div>

    <div class="subtitle">
        Create your customer account
    </div>

    <h2>
        Sign Up
    </h2>

    <form id="signupForm">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="6"
            required
        >


        <button
            type="submit"
            id="signupButton"
        >
            Create Account
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

    const SUPABASE_URL =
        "https://oikdlfdviruwwukwosmn.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_bMEfqkt2eZPBiNDXY8gbEA_okVZKsLU";


    const signupForm =
        document.getElementById(
            "signupForm"
        );

    const signupButton =
        document.getElementById(
            "signupButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;
    }


    signupForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById(
                        "confirmPassword"
                    )
                    .value;


            if (!name) {

                showMessage(
                    "Please enter your name.",
                    "error"
                );

                return;
            }


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;
            }


            signupButton.disabled =
                true;

            signupButton.textContent =
                "Creating account...";


            try {

                const response =
                    await fetch(
                        SUPABASE_URL +
                        "/auth/v1/signup",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                apikey:
                                    SUPABASE_KEY
                            },

                            body:
                                JSON.stringify({
                                    email:
                                        email,

                                    password:
                                        password,

                                    data: {
                                        full_name:
                                            name
                                    }
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.msg ||
                        data.message ||
                        data.error_description ||
                        "Unable to create account."
                    );
                }


                /*
                    Supabase may require
                    email confirmation depending
                    on your project settings.
                */

                showMessage(
                    "Account created successfully! Check your email if verification is required.",
                    "success"
                );


                signupForm.reset();


                setTimeout(
                    () => {

                        window.location.href =
                            "login.html";

                    },
                    2500
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message,
                    "error"
                );

            } finally {

                signupButton.disabled =
                    false;

                signupButton.textContent =
                    "Create Account";
            }

        }
    );

</script>

</body>
</html>
